<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лист — учебный проект</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="layout">
    <section class="intro"><div class="brand"><span class="brand-mark">❧</span> Лист</div><div class="intro-copy"><h1>Лист</h1><p>Учебный проект</p></div></section>
    <section class="right">
      <div id="auth-panel" class="card">
        <div class="card-top"><span class="dot"></span> ДОСТУП К СИСТЕМЕ</div>
        <h2 id="form-title">С возвращением</h2>
        <p class="muted" id="form-subtitle">Войдите в свою учётную запись</p>
        <div class="tabs"><button id="login-tab" class="active" type="button">Вход</button><button id="register-tab" type="button">Регистрация</button></div>
        <form id="auth-form">
          <label for="email">Электронная почта</label>
          <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" placeholder="Не менее 8 символов" autocomplete="current-password" minlength="8" required>
          <div id="register-fields" hidden>
            <label for="role">Тип учётной записи</label>
            <select id="role" name="role"><option value="user">Пользователь</option><option value="admin">Администратор</option></select>
            <label for="inviteCode">Код приглашения</label>
            <input id="inviteCode" name="inviteCode" type="text" placeholder="Код приглашения, не пароль" autocomplete="off">
            <p class="hint">Для каждой роли регистрация доступна один раз.</p>
          </div>
          <p id="message" class="message" role="status" aria-live="polite"></p>
          <button id="submit-button" class="primary" type="submit">Войти <span>→</span></button>
        </form>
        <p class="card-foot"><a href="https://github.com/Sshows/two-roles-auth-lab/blob/main/README.md" target="_blank" rel="noopener">Как работает сайт и код</a></p>
      </div>
      <div id="profile-panel" class="card" hidden>
        <div class="card-top"><span class="dot"></span> ЛИЧНЫЙ КАБИНЕТ</div>
        <div class="avatar">✓</div>
        <h2>Вы вошли</h2>
        <p class="muted">Аккаунт успешно подтверждён на сервере.</p>
        <div class="profile-row"><span>Почта</span><strong id="profile-email"></strong></div>
        <div class="profile-row"><span>Роль</span><strong id="profile-role"></strong></div>
        <p class="hint"></p>
        <button id="logout-button" class="primary secondary" type="button">Выйти <span>→</span></button>
      </div>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
